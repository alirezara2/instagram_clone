{% extends 'base.html' %}
{% block title %}پست جدید{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="auth-box">
            <h3 class="text-center mb-4">ساخت پست جدید</h3>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary mt-3">انتشار</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
