{% extends 'base.html' %}
{% block title %}ثبت‌نام{% endblock %}
{% block content %}
<div class="auth-box">
    <h2>ثبت‌نام</h2>
    <p class="text-center text-muted mb-4">برای ثبت‌نام ایمیل خود را وارد کنید</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary mt-3">ثبت‌نام</button>
    </form>
    <div class="text-center mt-4">
        <p>حساب دارید؟ <a href="{% url 'login' %}">ورود</a></p>
    </div>
</div>
{% endblock %}
